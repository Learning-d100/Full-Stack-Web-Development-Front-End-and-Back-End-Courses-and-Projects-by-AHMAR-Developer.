<!DOCTYPE html> 
<html lang="en"> 
    <head>  
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <!--Favicon-->
        <link rel="icon" type="images/png" href="../FAVICON/wired-gradient-1383-sphere-loop-rotate.png">
        <!--Font Awesome Link-->
        <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <!-- Animate-on-scroll CSS -->
        <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
        <!--Google fonts poppins-->
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
        <!--Bootstrap Icons link--> 
        <link rel="stylesheet" href="https://unpkg.com/accordion-js@3.3.4/dist/accordion.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pushbar.js@1.0.0/src/pushbar.min.css">
        <lin rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
        <!--Google icons-->
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        <!--Javascript other link-->
        <script src="https://unpkg.com/accordion-js@3.3.4/dist/accordion.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/pushbar.js@1.0.0/src/pushbar.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-scrollspy/2.4.0/simple-scrollspy.min.js"></script>
        <!-- Animate-on-scroll Javascript-- -->
        <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
        <!--Link Javascript-->
        <script defer src="../JAVASCRIPT/Script.js"></script>
        <!--Link CSS-->
        <link rel="stylesheet" href="../CSS/Style.css">
        <title>
            Dropdown Menu
        </title>   
    </head>
    <body>
        <!--Header-->
        <header data-aos="zoom-in-down">
            <!--Logo-->
            <img data-aos="zoom-in-right" src="../MOTIONAL IMAGES/Loading Lottie animation.svg" alt="Motional Image">
            <!--Design by ...-->
            <h1 data-aos="zoom-in-left">Ahmar's Designe</h1>
            <!--Un-Ordered-List-->
            <ul data-aos="zoom-in-right">
                <!--List-Item-1 (Link-Twitter (Icon))-->
                <li><a href="https://twitter.com/" target="_blank"><i class="fa-brands fa-twitter"></i>Twitter</a></li>
                <!--List-Item-2 (Link-Facebook (Icon))-->
                <li><a href="https://www.facebook.com/" target="_blank"><i class="fa-brands fa-facebook-f"></i>Facebook</a></li>
                <!--List-Item-3 (Link-Github (Icon))-->
                <li><a href="https://github.com/" target="_blank"><i class="fa-brands fa-github"></i>Github</a></li>
                <!--List-Item-4 (Link-Linkedin (Icon))-->
                <li><a href="https://www.linkedin.com/" target="_blank"><i class="fa-brands fa-linkedin"></i>Linkedin</a></li>
            </ul>
        </header>
        <!--Main-->
        <main data-aos="zoom-in-up">
            <!--Drop-Down-->
            <div class="dropdown" data-aos="zoom-in">
                <!--Dropdown-Menu-->
                <input data-aos="zoom-in" type="text" class="textBox" placeholder="Dropdown Menu" readonly>
                <!--Options-->
                <div class="option" data-aos="zoom-in">
                    <!--Option-1 (HTML)-->
                    <div onclick="show('HTML')" data-aos="zoom-in"><i class="fa-brands fa-html5"></i> HTML</div>
                    <!--Option-2 (CSS)-->
                    <div onclick="show('CSS')" data-aos="zoom-in"><i class="fa-brands fa-css3-alt"></i> CSS</div>
                    <!--Option-3 (Javascript)-->
                    <div onclick="show('Javascript')" data-aos="zoom-in"><i class="fa-brands fa-js-square"></i> Javascript</div>
                    <!--Option-4 (Bootstrap)-->
                    <div onclick="show('Bootstrap')" data-aos="zoom-in"><i class="fa-brands fa-bootstrap"></i> Bootstrap</div>
                    <!--Option-5 (ReactJS)-->
                    <div onclick="show('ReactJS')" data-aos="zoom-in"><i class="fa-brands fa-react"></i> ReactJS</div>
                </div>
            </div>
        </main><hr>
        <!--Footer-->
        <footer data-aos="zoom-in-up">
            <!--Design by ...-->
            <h1 data-aos="zoom-in-left">Copyright © 2026 Ahmar's Designe</h1>
            <p>All rights reserved.</p>
        </footer><hr>
    </body>
</html>
