<!DOCTYPE html> 
<html lang="en"> 
    <head>  
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="https://unpkg.com/accordion-js@3.3.4/dist/accordion.min.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pushbar.js@1.0.0/src/pushbar.min.css" />
        <lin rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">

        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

        <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-scrollspy/2.4.0/simple-scrollspy.min.js"></script>
        <!--Link Javascript-->
        <script defer src="../JAVASCRIPT/Script.js"></script>
        <!--Link CSS-->
        <link rel="stylesheet" href="../CSS/Style.css">  
        <title>
            Tic-Tac-Toe Game
        </title>   
    </head>
    <body>
        <!--Header-->
        <header>
            <!--Main-Heading (Tic-Tac-Toe Game) (Title)-->
            <h1 class="title">Tic-Tac-Toe Game</h1>
        </header>
        <!--Gameplay-->
        <div class="gameplay-div">
            <!--First-Player (Title)-->
            <p class="player-title">First Player</p>
            <!--Reset-Game-Button-->
            <button class="reset-btn">Reset Game</button>
        </div>
        <!--Main (Tic-tac-toe Game)-->
        <main>
            <!--Game-Container-->
            <div class="game-container">
                <!--9-boxes with data-a (3,4, ....) respectively-->
                <div class="boxes box1" data-a="3"></div>
                <div class="boxes box2" data-a="4"></div>
                <div class="boxes box3" data-a="5"></div>
                <div class="boxes box4" data-a="6"></div>
                <div class="boxes box5" data-a="7"></div>
                <div class="boxes box6" data-a="8"></div>
                <div class="boxes box7" data-a="9"></div>
                <div class="boxes box8" data-a="10"></div>
                <div class="boxes box9" data-a="11"></div>
            </div>
        </main>
