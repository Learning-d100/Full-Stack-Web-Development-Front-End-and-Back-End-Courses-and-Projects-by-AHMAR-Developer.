            <!--Google icons-->
            <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

            <script src='https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js'></script>
    
            <!-- Animate-on-scroll Javascript-- -->
            <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

            <script defer src="Assets/JAVASCRIPT/Script.js"></script>
    
            <!--Link CSS-->
            <link rel="stylesheet" href="Assets/CSS/Style.css">
    
            <title>
    
                Sign In & Sign Up Form
    
            </title>
    </head>

    <body>

        <!--Particles Javascript-->
        <div id="particles-javascript"></div>

        <!--Container-->
        <div class="container" id="container">

            <!--Sign Up Container ( Form Container )-->
            <div class="sign-up-container form-container">

                <!--Form-->
                <form action="#">

                    <!--Heading-->
                    <h1>Create Account</h1>

                    <!--Social Container-->
                    <div class="social-container">

                        <!--Link ( Facebook )-->
                        <a href="#" class="social">

                            <!--Icon ( Facebook )-->
                            <i class="fa-brands fa-facebook-f"></i>

                        </a>

                        <!--Link ( Google )-->
                        <a href="#" class="social">

                            <!--Icon ( Google Plus )-->
                            <i class="fa-brands fa-google-plus-g"></i>

                        </a>

                        <!--Link ( Linkedin )-->
                        <a href="#" class="social">

                            <!--Icon ( Linkedin )-->
                            <i class="fa-brands fa-linkedin-in"></i>

                        </a>

                    </div>

                    <!--OR-->
                    <span>Or Use your Email for Registration</span>

                    <!--Input ( Name )-->
                    <input type="text" placeholder="Name">

                    <!--Input ( Email )-->
                    <input type="email" placeholder="Email">

                    <!--Input ( Password )-->
                    <input type="password" placeholder="Password">

                    <!--Button ( Sign Up )-->
                    <button>Sign Up</button>

                </form>

            </div>

            <!--Sign In Container ( Form Container )-->
            <div class="sign-in-container form-container">

                <!--Form-->
                <form action="#">

                    <!--Heading-->
                    <h1>Sign In</h1>
                    
                    <!--Social Container-->
                    <div class="social-container">

                        <!--Link ( Facebook )-->
                        <a href="#" class="social">

                            <!--Icon ( Facebook )-->
                            <i class="fab fa-facebook-f"></i>

                        </a>

                        <!--Link ( Google Plus )-->
                        <a href="#" class="social">

                            <!--Icon ( Google Plus )-->
                            <i class="fab fa-google-plus-g"></i>

                        </a>

                        <!--Link ( Linkedin )-->
                        <a href="#" class="social">

                            <!--Icon ( Linkedin )-->
                            <i class="fab fa-linkedin-in"></i>

                        </a>

                    </div>

                    <!--OR-->
                    <span>or use your account</span>

                    <!--Input ( Email )-->
                    <input type="email" placeholder="Email">

                    <!--Input ( Password )-->
                    <input type="password" placeholder="Password">

                    <!--Link ( Forgot Password )-->
                    <a href="#">Forgot your password?</a>

                    <!--Button ( Sign In )-->
                    <button>Sign In</button>

                </form>

            </div>

            <!--Overlay Container-->
            <div class="overlay-container">

                <!--Overlay-->
                <div class="overlay">

                    <!--Overlay Panel ( Left )-->
                    <div class="overlay-panel overlay-left">

                        <!--Heading-->
                        <h1>Welcome Back!</h1>

                        <!--Paragraph-->
                        <p>To keep connected with us please login with your personal info</p>

                        <!--Button ( Sign In )-->
                        <button class="ghost" id="signIn">Sign In</button>
                        
                    </div>

                    <!--Overlay Panel ( Right )-->
                    <div class="overlay-panel overlay-right">

                        <!--Heading-->
                        <h1>Hello, Friend!</h1>

                        <!--Paragraph-->
                        <p>Enter your personal details and start journey with us</p>

                        <!--Button ( Sign Up )-->
                        <button class="ghost" id="signUp">Sign Up</button>

                    </div>
                    
                </div>

            </div>

        </div>
