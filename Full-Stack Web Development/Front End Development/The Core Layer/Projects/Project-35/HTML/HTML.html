        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        <!--Javascript other link-->
        <script src="https://unpkg.com/accordion-js@3.3.4/dist/accordion.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/pushbar.js@1.0.0/src/pushbar.min.js"></script>

        <!--Link Javascript-->
        <script defer src="../JAVASCRIPT/JAVASCRIPT.js"></script>
        <!--Link CSS-->
        <link rel="stylesheet" href="../CSS/CSS.css">  
        <title>
            Calculator
        </title>   
    </head>
    <body> 
        <!--Project-Heading(35)-->
        <h1 class="prohead">Projects-<i><u>35</u></i>:-</h1><br>
        <!--calculator Heading-->
        <h1 class="title"><u>Calculator</u></h1>
        <!--Container-->
        <div id="container">
            <!--Calculator-->
            <div id="calculator">
                <!--Display-->
                <div class="calc-box" contenteditable="true" data-text="Enter Number"></div>
                <!--Calculator-Buttons(Numbers)-->
                <div class="numbers">
                    <div class="key extra">C</div><!--(C)Button-->
                    <div class="key extra">%</div><!--(%)Button-->
                    <div class="key extra">back</div><!--(back)Button-->
                    <div class="key extra">÷</div><!--(÷)Button-->
                    <div class="key">1</div><!--(1)Button-->
                    <div class="key">2</div><!--(2)Button-->
                    <div class="key">3</div><!--(3)Button-->
                    <div class="key extra">x</div><!--(x)Button-->
                    <div class="key">4</div><!--(4)Button-->
                    <div class="key">5</div><!--(5)Button-->
                    <div class="key">6</div><!--(6)Button-->
                    <div class="key extra">+</div><!--(+)Button-->
                    <div class="key">7</div><!--(7)Button-->
                    <div class="key">8</div><!--(8)Button-->
                    <div class="key">9</div><!--(9)Button-->
                    <div class="key extra">-</div><!--(-)Button-->
                    <div class="key">00</div><!--(00)Button-->
                    <div class="key">0</div><!--(0)Button-->
                    <div class="key">.</div><!--(.)Button-->
                    <div class="key extra">=</div><!--(=)Button-->
                </div>
            </div>
        </div>

    </body>
</html>
