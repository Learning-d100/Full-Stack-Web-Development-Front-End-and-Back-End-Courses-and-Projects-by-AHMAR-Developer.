<!DOCTYPE html> 
<html lang="en"> 
    <head>  
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <!--Font Awesome Link--> 
        <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <!--Google fonts poppins-->
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
        <!--Bootstrap Icons link--> 
        <link rel="stylesheet" href="https://unpkg.com/accordion-js@3.3.4/dist/accordion.min.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pushbar.js@1.0.0/src/pushbar.min.css" />
        <lin rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
        <!--Google icons-->
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        <!--Javascript other link-->
        <script src="https://unpkg.com/accordion-js@3.3.4/dist/accordion.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/pushbar.js@1.0.0/src/pushbar.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-scrollspy/2.4.0/simple-scrollspy.min.js"></script>
        <!--Link Javascript-->
        <script defer src="../JAVASCRIPT/Note List.js"></script>
        <!--Link CSS-->
        <link rel="stylesheet" href="../CSS/Note List.css">  
        <title>
            Note List
        </title>   
    </head>
    <body>
        <!--Container(Background)-->
        <section class="background">
            <!--Main heading (Notes)-->
            <h1><u>My Notes</u></h1>
            <!--Add-buttons (Note)-->
            <div id="add-btn">
                <button class="enter-btn" id="new-note">Add a new Note</button>
            </div>
        </section>
        <!--Popups-->
        <section id="popups" style="display: none">
            <!--Note Pop-up(Form)-->
            <form id="newnote-popup" style="display: none">
                <!--Close (Image) Button(Note Pop-up)-->
                <img class="close-popup-btn" src="../IMAGES/close-icon.png" alt="close">
                <!--Note-Title (Note Pop-up)-->
                <label for="newnote-title">Enter note title:</label>
                <!--Note-title input (Note Pop-up)-->
                <input type="text" id="newnote-title" autocomplete="off">
                <!--Label for description note (Note Pop-up)-->
                <label for="newnote-description">Enter note description:</label>
                <!--Description area (Note Pop-up)-->
                <textarea id="newnote-description" cols="30" rows="5"></textarea>
                <!--Submit Button (Note)-->
                <button id="note-submit">Add to notes</button>
            </form>
        </section>
        <!--Todo-Note (List) Display-->
        <section id="todo-note">
            <div class="note-list"></div>
        </section>
        <!--Back to dashboard link-->
        <a href="index.html" class="back-btn">← Back to Dashboard</a>
        <!--Copyright-->
        <p class="copyright">Created by <u>AHMAR</u> Developer from <a href="https://github.com/learning-d100">Github Link</a></p>
    </body> 
</html>
