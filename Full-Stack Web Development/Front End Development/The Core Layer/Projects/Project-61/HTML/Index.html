<!DOCTYPE html> 
<html lang="en"> 
    <head>  
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <!--Favicon-->
        <link rel="icon" type="images/png" href="../FAVICON/wired-gradient-1383-sphere-loop-rotate.png">
        <!--Font Awesome Link-->
        <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
        <script src="https://kit.fontawesome.com/dd8c49730d.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <!-- Animate-on-scroll CSS -->
        <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">

        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
        <!--Bootstrap Icons link--> 
        <link rel="stylesheet" href="https://unpkg.com/accordion-js@3.3.4/dist/accordion.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pushbar.js@1.0.0/src/pushbar.min.css">

        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

        <!-- Animate-on-scroll Javascript-- -->
        <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
        <!--Link Javascript-->
        <script defer src="../JAVASCRIPT/Script.js"></script>
        <!--Link CSS-->
        <link rel="stylesheet" href="../CSS/Style.css">
        <title>
            Portfolio Design
        </title>

    <body>
        <!--Container-->
        <div class="container" data-aos="fade-in">
            <!--Heading-->
            <header>
                <!--Navigation-->
                <nav>
                    <!--Motional-Image-->
                    <img data-aos="zoom-in-right" src="../MOTIONAL IMAGES/Loading Lottie animation.svg" alt="Motional Image" class="motional-image">
                    <!--Logo-->
                    <img data-aos="zoom-in-down" src="../LOGOS/logo.png" alt="Logo">
                    <!--Un-Ordered-List-->
                    <ul data-aos="zoom-in-left">
                        <!--List-Item-1 (Link-Home)-->
                        <li><a href="#home">HOME</a></li>
                        <!--List-Item-2 (Link-About)-->
                        <li><a href="#about">ABOUT</a></li>
                        <!--List-Item-3 (Link-Portfolio)-->
                        <li><a href="#portfolio">PORTFOLIO</a></li>
                        <!--List-Item-4 (Link-Services)-->
                        <li><a href="#services">SERVICES</a></li>
                        <!--List-Item-5 (Link-Hire-Me)-->
                        <li><a href="#hire-me">HIRE ME</a></li>
                    </ul>
                </nav>
            </header>
            <!--Main (Body)-->
            <main>
                <!--Box-->
                <div class="box" data-aos="zoom-in">
                    <!--Heading-->
                    <h1>I'M Chalin <span>Amelia</span></h1>
                    <!--Description-->
                    <p>
                        This is my official Portfolio Website to showcase my all works related to<br>Web Development and UI Design.
                    </p>
                    <!--Button (Link)-->
                    <a href="#" data-aos="zoom-in-up">Download CV</a>
                </div>
                <!--Images-->
                <div class="images" data-aos="zoom-in">
                    <!--Shape Image-->
                    <img src="../IMAGES/shape.png" alt="Shape Image" class="shape-image">
                    <!--User Image-->
                    <img src="../IMAGES/user.png" alt="User Image" class="user-image">
                </div>
                <!--Social-Media-Icons-->
                <div class="social-media" data-aos="zoom-in-up">
                    <!--Three Links (Icons (youtube, instagram, whatsapp))-->
                    <a href="#"><i class="fa-brands fa-youtube"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
                </div>
            </main>
        </div>
    </body>
</html>
