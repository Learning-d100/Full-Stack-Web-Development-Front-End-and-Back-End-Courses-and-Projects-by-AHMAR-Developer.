<!DOCTYPE html> 
<html lang="en"> 
    <head>  
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0", maximum-scale=1.0, user-scalable=no">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <!--Favicon-->
        <link rel="icon" type="images/png" href="Assets/FAVICONS/wired-gradient-1383-sphere-loop-rotate.png">
        <!--Font Awesome Link-->
        <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
        <script src="https://kit.fontawesome.com/dd8c49730d.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <!-- Animate-on-scroll CSS -->
        <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
        <!--Google fonts poppins-->
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
        <!--Bootstrap Icons link--> 
        <link rel="stylesheet" href="https://unpkg.com/accordion-js@3.3.4/dist/accordion.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pushbar.js@1.0.0/src/pushbar.min.css">
        <lin rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
        <!--Google icons-->
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        <!--Javascript other link-->
        <script src="https://unpkg.com/accordion-js@3.3.4/dist/accordion.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/pushbar.js@1.0.0/src/pushbar.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-scrollspy/2.4.0/simple-scrollspy.min.js"></script>
        <!-- Animate-on-scroll Javascript-- -->
        <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
        <!--Link Javascript-->
        <script defer src=""></script>
        <!--Link CSS-->
        <link rel="stylesheet" href="Assets/CSS/Style.css">
        <title>
            Animated Tab Bar
        </title>   
    </head>
    <body>
        <!-- Tab bar container -->
        <div class="phone">
            <!-- Radio inputs for tab selection -->
            <input type="radio" name="s" id="social-1">
            <input type="radio" name="s" id="social-2" checked="checked">
            <input type="radio" name="s" id="social-3">
            <!-- Labels for tab icons -->
            <label for="social-1"><img src="Assets/Icons/instagram.svg" alt=""></label>
            <label for="social-2"><img src="Assets/Icons/twitter.svg" alt=""></label>
            <label for="social-3"><img src="Assets/Icons/github.svg" alt=""></label>
            <!-- Circle element for highlighting selected tab -->
            <div class="circle"></div>
            <!-- Container for tab content -->
            <div class="phone_content">
                <!-- Bottom section of the phone, where the tab indicator is placed -->
                <div class="phone_bottom">
                    <!-- Indicator for the selected tab -->
                    <span class="indicator"></span>
                </div>
            </div>
        </div>
    </body>
</html>
